# ==============================================================================
# PETSGRAM Cloud-Native Kubernetes Production Deployment Specifications
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: petsgram-backend-deployment
  namespace: petsgram-production
  labels:
    app: petsgram-backend
spec:
  replicas: 3 # Enforce high-availability horizontal replicas
  strategy:
    type: RollingUpdate # Rolling zero-downtime updates
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: petsgram-backend
  template:
    metadata:
      labels:
        app: petsgram-backend
    spec:
      containers:
        - name: api-container
          image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/petsgram-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi" # Memory ceiling limit
          envFrom:
            - secretRef:
                name: petsgram-db-secrets # Mount credentials securely from Vault/Secrets manager
          readinessProbe:
            httpGet:
              path: /api/v1/pets
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/pets
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: petsgram-backend-service
  namespace: petsgram-production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
  selector:
    app: petsgram-backend

---

# Enforce Horizontal Pod Autoscaler (HPA) to handle traffic spikes (Up to 10 instances!)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: petsgram-backend-hpa
  namespace: petsgram-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: petsgram-backend-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---

# Ingress Controller mapping secure TLS domains reverse routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petsgram-ingress
  namespace: petsgram-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - api.petsgram.io
      secretName: petsgram-ssl-certs
  rules:
    - host: api.petsgram.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petsgram-backend-service
                port:
                  number: 80
