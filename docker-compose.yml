version: '3.8'

services:
  # Relational Database Service (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: petsgram_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
      POSTGRES_DB: petsgram_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petsgram_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petsgram_network

  # Distributed Caching & Event Broker (Redis)
  redis_cache:
    image: redis:7-alpine
    container_name: petsgram_redis
    restart: always
    command: redis-server --requirepass redis_secure_pass_2026
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_pass_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petsgram_network

  # Node.js Express Backend API Service (Production Mode)
  api_service:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: petsgram_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass_2026@postgres_db:5432/petsgram_db?schema=public
      - REDIS_URL=redis://:redis_secure_pass_2026@redis_cache:6379/0
      - JWT_SECRET=cf6c1a8e2da8b7468165b4c1072a2e46b0a1d48c0827efc90a184efcb40ad9163f8d9b1a0e
      - JWT_REFRESH_SECRET=fbc5928a0e37de8ac89fca82d9217eef9b0aef793b827e8a9fbc7468dc0efb92f70ad
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - petsgram_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  petsgram_network:
    driver: bridge
